name: Deploy React Application

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Retrieve previous deployment
        run: |
          mkdir -p "$RUNNER_TEMP/previous-site"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --no-tags --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
            git archive origin/gh-pages | tar -x -C "$RUNNER_TEMP/previous-site"
          fi
      - name: Compare sitemap and rendered pages
        run: node scripts/indexnow.mjs prepare "$RUNNER_TEMP/previous-site" dist "$RUNNER_TEMP/indexnow-delta.json"
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
      - name: Submit changed URLs to IndexNow
        run: node scripts/indexnow.mjs submit dist "$RUNNER_TEMP/indexnow-delta.json"
