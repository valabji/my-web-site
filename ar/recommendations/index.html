idden="true"><span></span><span></span><span></span></span></button></div></div></nav><main id="main-content" tabindex="-1" aria-label="المحتوى الرئيسي"><section id="recommendations" class="section" aria-labelledby="recommendations-heading"><div class="container"><header class="reveal rec-head is-in"><span class="rec-head__mark mono" aria-hidden="true">//</span><h2 id="recommendations-heading" class="rec-head__title"><span class="gradient-text">التوصيات</span></h2></header><ul class="rec-grid"><li class="tilt-3d reveal card rec-card is-in" style="--rv-delay: 0s;"><figure><span class="rec-card__quote mono" aria-hidden="true">“</span><div class="rec-card__text-wrap"><blockquote id="recommendation-0-text" class="rec-card__text" dir="auto" lang="ar">عملنا معًا في عدة مشاريع، وعبدالرحمن من أفضل الشركاء الذين يمكن العمل معهم. أوصي به بشدة لما يتمتع به من موهبة؛ فقد ساعدتنا مهاراته في البرمجة وحل المشكلات على تجاوز الأوقات الصعبة والابتكار.</blockquote><button class="rec-card__original-toggle mono" type="button" aria-controls="recommendation-0-text" aria-pressed="false"><span aria-hidden="true">Aa</span>عرض النص الأصلي</button></div><figcaption class="rec-card__meta"><span class="rec-card__name">Mustafa Yousif</span><span class="rec-card__role">محلل نظم تشغيل في محاكم دبي</span><span class="rec-card__rel mono">عمل مصطفى مع عبدالرحمن ضمن الفريق نفسه</span><time class="rec-card__date mono">24 فبراير 2024</time></figcaption></figure></li><li class="tilt-3d reveal card rec-card is-in" style="--rv-delay: 0.08s;"><figure><span class="rec-card__quote mono" aria-hidden="true">“</span><div class="rec-card__text-wrap"><blockquote id="recommendation-1-text" class="rec-card__text" dir="auto" lang="ar">عبدالرحمن مطور ذو خبرة ومهارة عالية في تطوير الواجهات الأمامية والخلفية. كان عنصرًا أساسيًا في فريقنا، وأظهر كفاءة في PHP وLaravel وJavaScript وReact وReact Native، إلى جانب DevOps. أُقدّر مهاراته والتزامه وتحمله مسؤولية العمل، وقد أدى دورًا محوريًا في تقدم المشاريع المختلفة التي عملنا عليها. أوصي به بكل ثقة ليكون عضوًا أساسيًا في أي فريق.</blockquote><button class="rec-card__original-toggle mono" type="button" aria-controls="recommendation-1-text" aria-pressed="false"><span aria-hidden="true">Aa</span>عرض النص الأصلي</button></div><figcaption class="rec-card__meta"><span class="rec-card__name">Muhammad Uzair Ahmed Khan</span><span class="rec-card__role">مهندس برمجيات أول</span><span class="rec-card__rel mono">كان محمد عزير المدير المباشر لعبدالرحمن</span><time class="rec-card__date mono">16 أكتوبر 2022</time></figcaption></figure></li><li class="tilt-3d reveal card rec-card" style="--rv-delay: 0.16s;"><figure><span class="rec-card__quote mono" aria-hidden="true">“</span><div class="rec-card__text-wrap"><blockquote id="recommendation-2-text" class="rec-card__text" dir="auto" lang="ar">عملت مع فلبجي، وأتمنى أن يستمر تعاوننا دائمًا. إنه ذكي ونشيط وجدير بالثقة. التقيته أول مرة في مقابلة عمل، حين كنا نبحث عمّن يصلح تطبيقنا خلال مهلة قصيرة جدًا. تحمّل مسؤولية المشكلة وعمل بروح الفريق دون تردد؛ ومنذ الأسبوع الأول كنا نعمل لأكثر من 18 ساعة، حتى تمكن من حل المشكلات كلها تدريجيًا. فلبجي شاب يعتمد على نفسه، ويتمتع بالمبادرة والحماس والصدق، ويمكن الاعتماد عليه بكل ثقة.</blockquote><button class="rec-card__original-toggle mono" type="button" aria-controls="recommendation-2-text" aria-pressed="false"><span aria-hidden="true">Aa</span>عرض النص الأصلي</button></div><figcaption class="rec-card__meta"><span class="rec-card__name">Majid Abdelaal</span><span class="rec-card__role">نحو آفاق جديدة من التميّز الهندسي | شريك مؤسس ومدير تقني في NGE</span><span class="rec-card__rel mono">كان ماجد المدير المباشر لعبدالرحمن</span><time class="rec-card__date mono">29 أبريل 2021</time></figcaption></figure></li><li class="tilt-3d reveal card rec-card" style="--rv-delay: 0.24s;"><figure><span class="rec-card__quote mono" aria-hidden="true">“</span><div class="rec-card__text-wrap"><blockquote id="recommendation-3-text" class="rec-card__text" dir="auto" lang="ar">عبدالرحمن مطور موهوب للغاية، شغوف بالتعلم ويحب التحديات. عملت معه شخصيًا، ورأيته يحقق نتائج متميزة في تطوير الواجهات الأمامية والخلفية. أتمنى له كل النجاح في مشاريعه المستقبلية الواعدة.</blockquote><button class="rec-card__original-toggle mono" type="button" aria-controls="recommendation-3-text" aria-pressed="false"><span aria-hidden="true">Aa</span>عرض النص الأصلي</button></div><figcaption class="rec-card__meta"><span class="rec-card__name">Abdeen Mohamed</span><span class="rec-card__role">مهندس تطوير الواجهات الأمامية والخلفية | مطور برمجيات | رائد أعمال</span><span class="rec-card__rel mono">عمل عابدين مع عبدالرحمن ضمن الفريق نفسه</span><time class="rec-card__date mono">10 ديسمبر 2018</time></figcaption></figure></li><li class="tilt-3d reveal card rec-card" style="--rv-delay: 0.32s;"><figure><span class="rec-card__quote mono" aria-hidden="true">“</span><div class="rec-card__text-wrap"><blockquote id="recommendation-4-text" class="rec-card__text" dir="auto" lang="ar">عبدالرحمن موظف موهوب ومبادر وسريع التعلم. يتميز بمهاراته في الدعم الفني لأجهزة الحاسوب وإدارة الشبكات وتشخيص الأعطال وإصلاحها، وهو عضو فاعل في الفريق.</blockquote><button class="rec-card__original-toggle mono" type="button" aria-controls="recommendation-4-text" aria-pressed="false"><span aria-hidden="true">Aa</span>عرض النص الأصلي</button></div><figcaption class="rec-card__meta"><span class="rec-card__name">Haitham Dahab</span><span class="rec-card__role">مدير تحليلات المعلومات في دال للأغذية</span><span class="rec-card__rel mono">كان هيثم المدير المباشر لعبدالرحمن</span><time class="rec-card__date mono">9 ديسمبر 2018</time></figcaption></figure></li></ul></div></section></main><button type="button" class="scroll-up " aria-label="العودة إلى أعلى الصفحة"><span class="lni lni-chevron-up" aria-hidden="true"></span></button></div></div>
